<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Acceso - EasyStock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <div class="contenedor-registro">

        <form class="row g-3 formulario-registro">

            <h2 class="titulo">Recuperar Acceso</h2>

            <div class="col-12">
                <p class="texto-ayuda">
                    Selecciona qué deseas recuperar.
                </p>
            </div>

            <div class="col-12">

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="recuperacion"
                        id="recuperarPassword"
                        checked>

                    <label
                        class="form-check-label"
                        for="recuperarPassword">

                        Recuperar contraseña
                    </label>
                </div>

                <div class="form-check mt-2">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="recuperacion"
                        id="recuperarUsuario">

                    <label
                        class="form-check-label"
                        for="recuperarUsuario">

                        No recuerdo mi usuario
                    </label>
                </div>

            </div>

            <div class="col-12">
                <label class="form-label">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    class="form-control"
                    placeholder="correo@ejemplo.com">
            </div>

            <div class="col-12">
                <button
                    type="button"
                    class="btn btn-primary w-100">

                    Continuar
                </button>
            </div>

            <div class="col-12 text-center">
                <a
                    href="login.html"
                    class="volver-login">

                    Volver al inicio de sesión
                </a>
            </div>

        </form>

    </div>

</body>
</html>
