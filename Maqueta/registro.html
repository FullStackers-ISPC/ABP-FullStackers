<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - EasyStock</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>

    <div class="contenedor-registro">

        <form class="row g-3 formulario-registro">

            <a href="index.html" class="btn-volver">
                ← Home
            </a>

            <h2 class="titulo">Registro de Usuario</h2>

            <div class="col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Ingrese su nombre">
            </div>

            <div class="col-md-6">
                <label class="form-label">Apellido</label>
                <input type="text" class="form-control" placeholder="Ingrese su apellido">
            </div>

            <div class="col-md-6">
                <label class="form-label">Usuario</label>
                <input type="text" class="form-control" placeholder="Ingrese un usuario">
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="correo@ejemplo.com">
            </div>

            <div class="col-md-6">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" placeholder="Ingrese una contraseña de 8 caracteres">
            </div>

            <div class="col-md-6">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" class="form-control" placeholder="Repita la contraseña">
            </div>

            <div class="col-md-6">
                <label class="form-label">Ciudad</label>
                <input type="text" class="form-control" placeholder="Ingrese su ciudad">
            </div>

            <div class="col-md-6">
                <label class="form-label">Provincia</label>
                <select class="form-select">
                    <option selected>Seleccione una provincia</option>
                    <option>Buenos Aires</option>
                    <option>Córdoba</option>
                    <option>Santa Fe</option>
                    <option>Otra</option>
                </select>
            </div>

            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terminos">
                    <label class="form-check-label" for="terminos">
                        Acepto los términos y condiciones
                    </label>
                </div>
            </div>

            <div class="col-12">
                <button type="button" class="btn btn-primary w-100">
                    Registrarse
                </button>
            </div>

            <div class="col-12 text-center">
                <a href="login.html" class="volver-login">
                    Volver al inicio de sesión
                </a>
            </div>

        </form>

    </div>

</body>
</html>
